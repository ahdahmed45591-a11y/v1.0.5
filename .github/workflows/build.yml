name: Android APK & Backend Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Android Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BAOU-Finance-v1.0.5-Debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

  test-backend:
    name: Test Backend Django
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: baou
          POSTGRES_USER: baou
          POSTGRES_PASSWORD: baou
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U baou"
          --health-interval 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      BRVM_DATA_DIR: ${{ github.workspace }}/data/brvm_data
      UPLOAD_DIR: /tmp/uploads

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend_django/requirements.txt

    - name: Install Dependencies
      run: pip install -r backend_django/requirements.txt

    - name: Check BRVM CSV Parser
      run: python backend_django/api/brvm.py

    - name: Migrate and Seed
      working-directory: backend_django
      run: |
        python manage.py makemigrations api --noinput
        python manage.py migrate --noinput
        python manage.py seed

    - name: Run API End-to-End Test
      working-directory: backend_django
      run: |
        gunicorn config.wsgi:application --bind 127.0.0.1:3001 --workers 2 --daemon
        for i in $(seq 30); do curl -sf http://127.0.0.1:3001/health && break; sleep 2; done
        python test_api.py
