services:
  db:
    image: postgres:16-alpine
    container_name: baou_finance_db
    env_file: [.env.docker]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
    restart: always

  backend:
    build: ./backend_django
    container_name: baou_finance_api
    ports:
      - "3001:3001"
    env_file: [.env.docker]
    environment:
      POSTGRES_HOST: db
      BRVM_DATA_DIR: /data/brvm_data
      UPLOAD_DIR: /data/uploads
    volumes:
      - ./data/brvm_data:/data/brvm_data:ro
      - ./data/uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: always

  admin:
    build: ./admin
    container_name: baou_finance_admin
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
